name: ODT P4 reviewed one-cell reference actual Chromium acceptance
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/odt-association-review.ts'
      - 'ui/app/odt-reviewed-cell-association.mjs'
      - 'ui/app/odt-cell-disclosure-review.mjs'
      - 'ui/app/odt-structure-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_odt_p4_association_tests.mjs'
      - 'tests/acceptance/run_odt_p4_real_browser.py'
      - 'docs/architecture/ODT_P4_REVIEWED_CELL_ASSOCIATION_ORACLES.md'
      - '.github/workflows/odt-p4-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odt-reviewed-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci
      - name: CI-only isolated Chromium with pinned Playwright
        run: |
          python3 -m venv /tmp/odt-p4-venv
          /tmp/odt-p4-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          bash scripts/ci-normalize-ubuntu-mirror.sh
          /tmp/odt-p4-venv/bin/python -m playwright install --with-deps chromium
      - name: Exact-source independent ODT P1-P4 and DOCX source security negatives
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_odt_tables_p1_tests.mjs
          node tests/browser/run_odt_structure_ui_tests.mjs
          node tests/browser/run_odt_p3_cell_review_tests.mjs
          node tests/browser/run_odt_p4_association_tests.mjs
          node tests/enterprise-import/run_docx_tables_p1_tests.mjs
          node tests/browser/run_docx_structure_ui_tests.mjs
          node tests/browser/run_docx_p3_cell_review_tests.mjs
          node tests/browser/run_docx_p4_reviewed_association_tests.mjs
      - name: Build and verify actual clean Git source browser release
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Real Chromium ODT P2/P3 and downloaded ODT P4 sidecar
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18994 --bind 127.0.0.1 --directory ui/dist >/tmp/odt-p4-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18994/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18994/browser-build-manifest.json >/dev/null
          /tmp/odt-p4-venv/bin/python tests/acceptance/run_odt_p2_real_browser.py \
            --url http://127.0.0.1:18994/ --evidence-dir /tmp/odt-p4-ci/p2
          /tmp/odt-p4-venv/bin/python tests/acceptance/run_odt_p3_real_browser.py \
            --url http://127.0.0.1:18994/ --evidence-dir /tmp/odt-p4-ci/p3
          /tmp/odt-p4-venv/bin/python tests/acceptance/run_odt_p4_real_browser.py \
            --url http://127.0.0.1:18994/ --evidence-dir /tmp/odt-p4-ci/p4
      - name: Upload actual source and Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odt-p4-real-chromium-evidence
          path: /tmp/odt-p4-ci/
          if-no-files-found: ignore
