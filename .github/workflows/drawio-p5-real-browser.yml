name: DRAWIO P5 saved P4 source-bound replay actual Chromium
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/drawio-report-replay.ts'
      - 'ui/src/browser/drawio-report-replay-file.ts'
      - 'ui/app/drawio-reference-replay-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_drawio_p5_saved_replay_tests.mjs'
      - 'tests/acceptance/run_drawio_p5_real_browser.py'
      - 'docs/architecture/DRAWIO_P5_ORIGINAL_SOURCE_REPLAY_ORACLES.md'
      - '.github/workflows/drawio-p5-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drawio-p5-original-replay-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Isolated actual Chromium
        run: |
          python3 -m venv /tmp/drawio-p5-venv
          /tmp/drawio-p5-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          bash scripts/ci-normalize-ubuntu-mirror.sh
          /tmp/drawio-p5-venv/bin/python -m playwright install --with-deps chromium
      - name: Exact source identity, P1 through P5 and independent security regression
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_drawio_p1p2_tests.mjs
          node tests/browser/run_drawio_p3_compressed_tests.mjs
          node tests/browser/run_drawio_p4_reviewed_references_tests.mjs
          node tests/browser/run_drawio_p5_saved_replay_tests.mjs
          node tests/browser/run_nessus_p3_reviewed_references_tests.mjs
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
          node tests/browser/run_odt_p6_report_replay_tests.mjs
          node tests/browser/run_docx_p6_report_replay_tests.mjs
      - name: Build genuine compiled YadiLab and verify release identity
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Actual Chromium saved P4 replay and previous draw.io Nmap regressions
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18992 --bind 127.0.0.1 --directory ui/dist >/tmp/drawio-p5-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18992/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18992/browser-build-manifest.json >/dev/null
          /tmp/drawio-p5-venv/bin/python tests/acceptance/run_drawio_p2_real_browser.py --url http://127.0.0.1:18992/ --evidence-dir /tmp/drawio-p5-evidence/p2
          /tmp/drawio-p5-venv/bin/python tests/acceptance/run_drawio_p3_real_browser.py --url http://127.0.0.1:18992/ --evidence-dir /tmp/drawio-p5-evidence/p3
          /tmp/drawio-p5-venv/bin/python tests/acceptance/run_drawio_p4_real_browser.py --url http://127.0.0.1:18992/ --evidence-dir /tmp/drawio-p5-evidence/p4
          /tmp/drawio-p5-venv/bin/python tests/acceptance/run_drawio_p5_real_browser.py --url http://127.0.0.1:18992/ --evidence-dir /tmp/drawio-p5-evidence/p5
          /tmp/drawio-p5-venv/bin/python tests/acceptance/run_nmap_xml_p2_real_browser.py --url http://127.0.0.1:18992/ --evidence-dir /tmp/drawio-p5-evidence/nmap
      - name: Preserve actual Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawio-p5-saved-replay-real-chromium
          path: /tmp/drawio-p5-evidence/
          if-no-files-found: ignore
