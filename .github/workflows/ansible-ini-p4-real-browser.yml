name: Ansible INI P4 original-byte live-Builder source gate Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/src/browser/ansible-ini-association-file.ts'
      - 'ui/app/ansible-ini-inspection-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_ansible_ini_association_ui_tests.mjs'
      - 'tests/browser/run_ansible_ini_p4_original_export_tests.mjs'
      - 'tests/acceptance/run_ansible_ini_p4_real_browser.py'
      - 'docs/architecture/ANSIBLE_INI_P4_ORIGINAL_SOURCE_EXPORT_ORACLES.md'
      - '.github/workflows/ansible-ini-p4-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ansible-ini-p4-original-byte-compiled-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency install
        run: npm ci
      - name: Install isolated pinned Playwright Chromium
        run: |
          python3 -m venv /tmp/ansible-ini-p4-venv
          /tmp/ansible-ini-p4-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/ansible-ini-p4-venv/bin/python -m playwright install --with-deps chromium
      - name: Exact source test, P1-P4 unit, privacy and broad import regressions
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_ansible_ini_readonly_preview_tests.mjs
          node tests/enterprise-import/run_ansible_ini_association_review_tests.mjs
          node tests/browser/run_ansible_ini_inventory_ui_tests.mjs
          node tests/browser/run_ansible_ini_association_ui_tests.mjs
          node tests/browser/run_ansible_ini_p4_original_export_tests.mjs
          node tests/enterprise-import/run_ansible_yaml_readonly_preview_tests.mjs
          node tests/enterprise-import/run_ansible_association_review_tests.mjs
          node tests/browser/run_ansible_yaml_inventory_ui_tests.mjs
          node tests/browser/run_ansible_yaml_p4_original_export_tests.mjs
          node tests/browser/run_ansible_yaml_p5_saved_replay_tests.mjs
          node tests/enterprise-import/run_graphml_readonly_preview_tests.mjs
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
      - name: Compile actual YadiLab and verify release identity
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Run compiled real Chromium INI P2-P4 and YAML/GraphML/Nmap
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18989 --bind 127.0.0.1 --directory ui/dist >/tmp/ansible-ini-p4-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18989/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18989/browser-build-manifest.json >/dev/null
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_ansible_ini_p2_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/ini-p2
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_ansible_ini_p3_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/ini-p3
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_ansible_ini_p4_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/ini-p4
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_ansible_yaml_p4_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/yaml-p4
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_ansible_yaml_p5_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/yaml-p5
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_nmap_xml_p2_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/nmap
          /tmp/ansible-ini-p4-venv/bin/python tests/acceptance/run_graphml_p2c_real_browser.py --url http://127.0.0.1:18989/ --evidence-dir /tmp/ansible-ini-p4-evidence/graphml
      - name: Preserve actual browser acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-ini-p4-byte-bound-chromium-evidence
          path: /tmp/ansible-ini-p4-evidence/
          if-no-files-found: ignore
