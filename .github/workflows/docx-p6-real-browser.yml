name: DOCX P6 original source replay saved P4/P5 actual Chromium acceptance
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/docx-report-replay.ts'
      - 'ui/src/browser/docx-report-replay-file.ts'
      - 'ui/app/docx-reference-replay-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_docx_p6_report_replay_tests.mjs'
      - 'tests/acceptance/run_docx_p6_real_browser.py'
      - 'docs/architecture/DOCX_P6_SOURCE_REPORT_REPLAY_ORACLES.md'
      - '.github/workflows/docx-p6-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-reference-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      # Ubuntu 24.04 hosted runners can stall for 35 minutes fetching
      # azure.archive.ubuntu.com; normalize only ephemeral APT sources.
      # Keep pinned Playwright and --with-deps Chromium test gate intact.
      - name: Normalize Ubuntu package mirror for Chromium dependencies
        run: |
          set -Eeuo pipefail
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source"
            fi
          done
          if sudo grep -R -l 'azure.archive.ubuntu.com' /etc/apt/sources.list.d /etc/apt/sources.list 2>/dev/null; then
            echo 'FAIL independent Chromium CI: Azure Ubuntu mirror still configured'
            exit 1
          fi
          echo 'PASS runner-local Ubuntu mirror normalized'
      - name: Pinned isolated real Chromium
        run: |
          python3 -m venv /tmp/docx-p6-venv
          /tmp/docx-p6-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/docx-p6-venv/bin/python -m playwright install --with-deps chromium
      - name: Independent strict sources and P1-P6 ZIP/security/SSR tests
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_docx_tables_p1_tests.mjs
          node tests/browser/run_docx_structure_ui_tests.mjs
          node tests/browser/run_docx_p3_cell_review_tests.mjs
          node tests/browser/run_docx_p4_reviewed_association_tests.mjs
          node tests/browser/run_docx_p5_multi_reference_tests.mjs
          node tests/browser/run_docx_p6_report_replay_tests.mjs
      - name: Build and attest actual YadiLab browser
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Real Chromium P2-P6 file upload source/report replay and unchanged Builder
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18991 --bind 127.0.0.1 --directory ui/dist >/tmp/docx-p6-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18991/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18991/browser-build-manifest.json >/dev/null
          /tmp/docx-p6-venv/bin/python tests/acceptance/run_docx_p2_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/docx-p6-acceptance/p2
          /tmp/docx-p6-venv/bin/python tests/acceptance/run_docx_p3_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/docx-p6-acceptance/p3
          /tmp/docx-p6-venv/bin/python tests/acceptance/run_docx_p4_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/docx-p6-acceptance/p4
          /tmp/docx-p6-venv/bin/python tests/acceptance/run_docx_p5_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/docx-p6-acceptance/p5
          /tmp/docx-p6-venv/bin/python tests/acceptance/run_docx_p6_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/docx-p6-acceptance/p6
      - name: Upload real test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-p6-actual-chromium
          path: /tmp/docx-p6-acceptance/
          if-no-files-found: ignore
