name: YadiLab release identity and Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-attested:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install exact dependencies
        run: npm ci
      - name: Reject inconsistent version metadata or spoofed release labels
        run: npm run test:release-identity
      - name: Source regression tests
        run: |
          npm run test:network-topology-import
          npm run test:imported-probes
          npm run test:ic000-capabilities
          npm run test:ic010-xml-discovery
          npm run test:ic010-p2-xml-ui
          npm run test:ic010-p3a-ansible
          npm run test:ic010-p3b-source-review
          npm run test:ic010-p3c-office
          npm run test:ic010-p3d-provenance
          npm run test:ic020-p1-source-freshness
          npm run test:ic020-p2a-link-review
          npm run test:ic020-p2b-reimport-review
          npm run test:ic020-p2c1-sidecar-replay
          npm run test:ic020-p2c2-multisheet
          npm run test:ic020-p2c3-unmapped
          npm run test:ic020-p2c4-matrix
          npm run test:ic020-p2c5-truth
          npm run test:ic020-p2c6-exit
          npm run test:ic030-p1-graphml-freshness
          npm run test:ic030-p2a-drawio-candidate
          npm run test:dev11-ui
          npm run test:ospf-p2p-dd
          npm run test:ospf-p2p-exchange
          npm run test:ospf-lsdb-summary
          npm run test:ospf-dd-summary-admission
          npm run test:ospf-lsr-fletcher
          npm run test:ospf-dd-mbit-done
          npm run test:ospf-loading-coordinator
          npm run test:ospf-lsa-body
          npm run test:ospf-area-lsdb
          npm run test:ospf-maxage-flush
      - name: Build browser from exact clean Git checkout
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run build:browser
      - name: Verify browser integrity and embedded Git identity
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify_browser_release.mjs
          node scripts/verify_release_identity.mjs
          npm run test:import003-ui
      - name: Build and hash Linux distribution
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          npm run build:launcher
          (cd distribution/linux-x86_64 && sha256sum -c SHA256SUMS.txt)
      - name: Launch attested app and verify HTTP release marker
        env:
          YADILAB_TEST_ONCE: '1'
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: bash start-yadilab.sh
      - name: Prepare independent Chromium release attestation
        run: |
          set -Eeuo pipefail
          python3 -m venv /tmp/yadilab-release-dom-venv
          /tmp/yadilab-release-dom-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/yadilab-release-dom-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify exact mounted UI and reject token-only JavaScript
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18995 --bind 127.0.0.1 --directory ui/dist >/tmp/yadilab-release-dom-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18995/build-marker.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18995/build-marker.json >/dev/null
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_release_identity_real_browser.py \
            --url http://127.0.0.1:18995/ --expected-commit "$YADILAB_EXPECTED_COMMIT" \
            --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic010_p2_shared_xml_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic010_p3a_shared_ansible_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic010_p3b_original_reference_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic010_p3c_shared_office_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic010_p3d_shared_status_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p1_core_inventory_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2a_link_review_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2b_reimport_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2c1_saved_report_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2c2_multisheet_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2c3_unmapped_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic020_p2c5_truth_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_graphml_p2c_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
          /tmp/yadilab-release-dom-venv/bin/python tests/acceptance/run_ic030_p1_graphml_real_browser.py \
            --url http://127.0.0.1:18995/ --evidence-dir /tmp/yadilab-release-dom-evidence
      - name: Preserve mounted release identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit006-mounted-release-identity
          path: /tmp/yadilab-release-dom-evidence/
          if-no-files-found: ignore
      - name: Package built Linux app
        run: |
          mkdir -p artifact/YadiLab_VERSION005_Linux_x86_64
          cp -a distribution artifact/YadiLab_VERSION005_Linux_x86_64/
          cp start-yadilab.sh artifact/YadiLab_VERSION005_Linux_x86_64/
          cp docs/VERSION005_RELEASE_IDENTITY.md artifact/YadiLab_VERSION005_Linux_x86_64/
          (cd artifact && zip -qr ../YadiLab_VERSION005_Linux_x86_64.zip YadiLab_VERSION005_Linux_x86_64)
          sha256sum YadiLab_VERSION005_Linux_x86_64.zip > YadiLab_VERSION005_Linux_x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: YadiLab_VERSION005_Linux_x86_64
          path: |
            YadiLab_VERSION005_Linux_x86_64.zip
            YadiLab_VERSION005_Linux_x86_64.zip.sha256
          if-no-files-found: error
