name: DOCX P4 reviewed cell reference actual Chromium acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/docx-association-review.ts'
      - 'ui/app/docx-reviewed-cell-association.mjs'
      - 'ui/app/docx-cell-disclosure-review.mjs'
      - 'ui/app/docx-structure-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_docx_p4_reviewed_association_tests.mjs'
      - 'tests/acceptance/run_docx_p4_real_browser.py'
      - 'docs/architecture/DOCX_P4_REVIEWED_CELL_ASSOCIATION_ORACLES.md'
      - '.github/workflows/docx-p4-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install test-only pinned Playwright + Chromium
        run: |
          python3 -m venv /tmp/docx-p4-venv
          /tmp/docx-p4-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/docx-p4-venv/bin/python -m playwright install --with-deps chromium
      - name: Compile exact source and run P1-P4 independent negative cases
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_docx_tables_p1_tests.mjs
          node tests/browser/run_docx_structure_ui_tests.mjs
          node tests/browser/run_docx_p3_cell_review_tests.mjs
          node tests/browser/run_docx_p4_reviewed_association_tests.mjs
          node tests/browser/run_ansible_ini_inventory_ui_tests.mjs
      - name: Compile and attest actual browser release
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Actual Chromium P2, P3 and P4 interaction on built release
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18989 --bind 127.0.0.1 --directory ui/dist >/tmp/docx-p4-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18989/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18989/browser-build-manifest.json >/dev/null
          /tmp/docx-p4-venv/bin/python tests/acceptance/run_docx_p2_real_browser.py \
            --url http://127.0.0.1:18989/ --evidence-dir /tmp/docx-p4-ci-evidence/p2
          /tmp/docx-p4-venv/bin/python tests/acceptance/run_docx_p3_real_browser.py \
            --url http://127.0.0.1:18989/ --evidence-dir /tmp/docx-p4-ci-evidence/p3
          /tmp/docx-p4-venv/bin/python tests/acceptance/run_docx_p4_real_browser.py \
            --url http://127.0.0.1:18989/ --evidence-dir /tmp/docx-p4-ci-evidence/p4
      - name: Upload real browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-p4-chromium-evidence
          path: /tmp/docx-p4-ci-evidence/
          if-no-files-found: ignore
