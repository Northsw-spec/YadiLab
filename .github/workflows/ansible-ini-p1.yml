name: Ansible INI P1 read-only strict parser and legacy regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/ansible-ini-preview.ts'
      - 'tests/enterprise-import/run_ansible_ini_readonly_preview_tests.mjs'
      - 'tests/fixtures/import/ansible-ini/**'
      - '.github/workflows/ansible-ini-p1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Frozen fixture consistency (PREP only)
        run: node tests/enterprise-import/run_ansible_ini_prep_fixture_contract.mjs
      - name: Actual P1 parser + adversarial tests
        run: |
          tsc -p tests/tsconfig.enterprise-import.json
          node tests/enterprise-import/run_ansible_ini_readonly_preview_tests.mjs
      - name: Previous import parser and association regressions
        run: |
          node tests/enterprise-import/run_ansible_yaml_readonly_preview_tests.mjs
          node tests/enterprise-import/run_ansible_association_review_tests.mjs
          node tests/enterprise-import/run_nmap_xml_preview_tests.mjs
          node tests/enterprise-import/run_nmap_association_review_tests.mjs
          node tests/enterprise-import/run_graphml_readonly_preview_tests.mjs
          node tests/enterprise-import/run_graphml_review_mapping_tests.mjs
          node tests/enterprise-import/run_planned_format_profile_tests.mjs
          npm run test:enterprise-import
      - name: Source release identity
        run: npm run test:release-identity
