name: DOCX P3 consented source-bound cell real Chromium acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/docx-cell-disclosure.ts'
      - 'ui/src/browser/docx-file-structural-preview.ts'
      - 'ui/app/docx-cell-disclosure-review.mjs'
      - 'ui/app/docx-structure-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_docx_p3_cell_review_tests.mjs'
      - 'tests/acceptance/run_docx_p3_real_browser.py'
      - 'docs/architecture/DOCX_TABLES_P3_DELIBERATE_CELL_DISCLOSURE.md'
      - '.github/workflows/docx-tables-p3-real-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consented-docx-real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked Node dependency tree
        run: npm ci
      - name: Install pinned Playwright and real Chromium only in CI
        run: |
          python3 -m venv /tmp/yadilab-docx-p3-venv
          /tmp/yadilab-docx-p3-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          bash scripts/ci-normalize-ubuntu-mirror.sh
          /tmp/yadilab-docx-p3-venv/bin/python -m playwright install --with-deps chromium
      - name: Independently test domain ZIP, secret/consent/locators and prior P2
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_docx_tables_p1_tests.mjs
          node tests/browser/run_docx_structure_ui_tests.mjs
          node tests/browser/run_docx_p3_cell_review_tests.mjs
          node tests/browser/run_ansible_ini_inventory_ui_tests.mjs
      - name: Compile and cryptographically verify actual YadiLab browser release
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Real Chromium user gestures and Builder identity (P2/P3)
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18988 --bind 127.0.0.1 --directory ui/dist >/tmp/yadilab-docx-p3-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18988/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18988/browser-build-manifest.json >/dev/null
          /tmp/yadilab-docx-p3-venv/bin/python tests/acceptance/run_docx_p2_real_browser.py \
            --url http://127.0.0.1:18988/ --evidence-dir /tmp/docx-p3-browser-evidence/p2
          /tmp/yadilab-docx-p3-venv/bin/python tests/acceptance/run_docx_p3_real_browser.py \
            --url http://127.0.0.1:18988/ --evidence-dir /tmp/docx-p3-browser-evidence/p3
      - name: Upload factual Ubuntu Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-p3-real-chromium-evidence
          path: /tmp/docx-p3-browser-evidence/
          if-no-files-found: ignore
