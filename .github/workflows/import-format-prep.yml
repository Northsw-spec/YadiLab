name: Import format PREP source regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/**'
      - 'ui/src/browser/import-*.ts'
      - 'ui/src/browser/network-topology-import.ts'
      - 'ui/app/main.mjs'
      - 'ui/app/graphml-preview-panel.mjs'
      - 'ui/app/nmap-observation-panel.mjs'
      - 'ui/src/browser/nmap-xml-file-preview.ts'
      - 'tests/browser/run_nmap_xml_observation_ui_tests.mjs'
      - 'tests/browser/run_graphml_preview_ui_tests.mjs'
      - 'tests/browser/run_network_topology_checkpoint_tests.mjs'
      - 'docs/architecture/IMPORT_FORMATS_PREP_001_ADR_AND_BASELINE.md'
      - '.github/workflows/import-format-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout actual GitHub source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use declared Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Source release contract test (not browser acceptance)
        run: npm run test:release-identity
      - name: Existing enterprise import adapters and adversarial cases
        run: npm run test:enterprise-import
      - name: Planned format identification must fail closed
        run: |
          tsc -p tests/tsconfig.enterprise-import.json
          node tests/enterprise-import/run_planned_format_profile_tests.mjs
      - name: Nmap read-only observations and hostile XML gates
        run: |
          tsc -p tests/tsconfig.enterprise-import.json
          node tests/enterprise-import/run_nmap_xml_preview_tests.mjs
      - name: GraphML read-only positive, negative and hostile input tests
        run: |
          tsc -p tests/tsconfig.enterprise-import.json
          node tests/enterprise-import/run_graphml_readonly_preview_tests.mjs
      - name: GraphML explicit mapping and adversarial review contract
        run: |
          tsc -p tests/tsconfig.enterprise-import.json
          node tests/enterprise-import/run_graphml_review_mapping_tests.mjs
      - name: Nmap XML observed-evidence UI and hostile browser file checks
        run: |
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
      - name: GraphML browser bridge and SSR safety contract
        run: |
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_graphml_preview_ui_tests.mjs
      - name: GraphML reviewed source schema and real Builder compilation
        run: |
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_graphml_builder_compilation_tests.mjs
      - name: Workbook and current quick-import regression
        run: |
          npm run test:workbook
          npm run test:network-topology-import
      - name: Imported modeled-probe and historical UI contract regressions
        run: |
          npm run test:imported-probes
          npm run test:dev11-ui
          npm run test:import-helper
