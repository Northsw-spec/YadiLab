name: Governance and evidence (not runtime certification)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  governance:
    name: governance-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate initial scope, source truth and document links
        run: python -m unittest discover -s tests -p 'test_*.py' -v
