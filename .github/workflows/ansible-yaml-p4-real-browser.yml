name: ANSIBLE YAML P4 original-source export gate compiled Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/src/browser/ansible-yaml-association-file.ts'
      - 'ui/app/ansible-inventory-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_ansible_yaml_inventory_ui_tests.mjs'
      - 'tests/browser/run_ansible_yaml_p4_original_export_tests.mjs'
      - 'tests/acceptance/run_ansible_yaml_p4_real_browser.py'
      - 'docs/architecture/ANSIBLE_YAML_P4_ORIGINAL_SOURCE_EXPORT_ORACLES.md'
      - '.github/workflows/ansible-yaml-p4-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ansible-yaml-p4-compiled-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Isolated Chromium with pinned Playwright
        run: |
          python3 -m venv /tmp/ansible-yaml-p4-venv
          /tmp/ansible-yaml-p4-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/ansible-yaml-p4-venv/bin/python -m playwright install --with-deps chromium
      - name: Exact source identity and P1-P4 security regression
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/enterprise-import/run_ansible_yaml_readonly_preview_tests.mjs
          node tests/enterprise-import/run_ansible_association_review_tests.mjs
          node tests/enterprise-import/run_ansible_ini_readonly_preview_tests.mjs
          node tests/enterprise-import/run_ansible_ini_association_review_tests.mjs
          node tests/browser/run_ansible_yaml_inventory_ui_tests.mjs
          node tests/browser/run_ansible_yaml_p4_original_export_tests.mjs
          node tests/browser/run_ansible_ini_inventory_ui_tests.mjs
          node tests/browser/run_ansible_ini_association_ui_tests.mjs
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
          node tests/browser/run_graphml_readonly_preview_tests.mjs
      - name: Compile actual YadiLab with reproducible identity
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Real Chromium source-bound YAML, INI, Nmap and GraphML regressions
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18988 --bind 127.0.0.1 --directory ui/dist >/tmp/ansible-yaml-p4-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18988/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18988/browser-build-manifest.json >/dev/null
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_ansible_yaml_p2_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/yaml-p2p3
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_ansible_yaml_p4_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/yaml-p4
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_ansible_ini_p2_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/ini-p2
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_ansible_ini_p3_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/ini-p3
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_nmap_xml_p2_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/nmap
          /tmp/ansible-yaml-p4-venv/bin/python tests/acceptance/run_graphml_p2c_real_browser.py --url http://127.0.0.1:18988/ --evidence-dir /tmp/ansible-yaml-p4-evidence/graphml
      - name: Preserve actual Chromium acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-yaml-p4-source-gate-real-chromium
          path: /tmp/ansible-yaml-p4-evidence/
          if-no-files-found: ignore
