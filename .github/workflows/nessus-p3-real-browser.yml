name: NESSUS P3 source-bound synthetic reviewed host references real Chromium
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-import/src/nessus-association-review.ts'
      - 'ui/src/browser/nessus-association-file.ts'
      - 'ui/app/nessus-association-review.mjs'
      - 'ui/app/nessus-severity-panel.mjs'
      - 'ui/app/main.mjs'
      - 'tests/browser/run_nessus_p3_reviewed_references_tests.mjs'
      - 'tests/acceptance/run_nessus_p3_real_browser.py'
      - 'docs/architecture/NESSUS_P3_REVIEWED_HOST_ORDINAL_ORACLES.md'
      - '.github/workflows/nessus-p3-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nessus-reviewed-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Isolated pinned test-only Chromium (no Nessus application installed)
        run: |
          python3 -m venv /tmp/nessus-p3-venv
          /tmp/nessus-p3-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          bash scripts/ci-normalize-ubuntu-mirror.sh
          /tmp/nessus-p3-venv/bin/python -m playwright install --with-deps chromium
      - name: Exact source and independent synthetic original-XML security cases
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_nessus_p1p2_tests.mjs
          node tests/browser/run_nessus_p3_reviewed_references_tests.mjs
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
          node tests/browser/run_odt_p6_report_replay_tests.mjs
          node tests/browser/run_docx_p6_report_replay_tests.mjs
      - name: Build and attest exact compiled YadiLab
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Real compiled Chromium P2 P3 and Nmap observed evidence regression
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18996 --bind 127.0.0.1 --directory ui/dist >/tmp/nessus-p3-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18996/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18996/browser-build-manifest.json >/dev/null
          /tmp/nessus-p3-venv/bin/python tests/acceptance/run_nessus_p2_real_browser.py --url http://127.0.0.1:18996/ --evidence-dir /tmp/nessus-p3-evidence/p2
          /tmp/nessus-p3-venv/bin/python tests/acceptance/run_nessus_p3_real_browser.py --url http://127.0.0.1:18996/ --evidence-dir /tmp/nessus-p3-evidence/p3
          /tmp/nessus-p3-venv/bin/python tests/acceptance/run_nmap_xml_p2_real_browser.py --url http://127.0.0.1:18996/ --evidence-dir /tmp/nessus-p3-evidence/nmap
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nessus-p3-synthetic-real-chromium
          path: /tmp/nessus-p3-evidence/
          if-no-files-found: ignore
