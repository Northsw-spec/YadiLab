name: DRAWIO P6 bounded all-vertex position navigation compiled Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/app/drawio-association-review.mjs'
      - 'tests/browser/run_drawio_p6_position_navigation_tests.mjs'
      - 'tests/acceptance/run_drawio_p6_real_browser.py'
      - 'docs/architecture/DRAWIO_P6_BOUNDED_VERTEX_NAVIGATION_ORACLES.md'
      - '.github/workflows/drawio-p6-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drawio-p6-ordinal-navigation-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact locked project dependencies
        run: npm ci
      - name: Isolated pinned real Chromium
        run: |
          python3 -m venv /tmp/drawio-p6-venv
          /tmp/drawio-p6-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          /tmp/drawio-p6-venv/bin/python -m playwright install --with-deps chromium
      - name: P6 frozen 45/1000-source assertions, P1-P5 and independent security regressions
        run: |
          set -Eeuo pipefail
          npm run test:release-identity
          tsc -p tests/tsconfig.enterprise-import.json
          tsc -p tests/tsconfig.browser.json
          node tests/browser/run_drawio_p1p2_tests.mjs
          node tests/browser/run_drawio_p3_compressed_tests.mjs
          node tests/browser/run_drawio_p4_reviewed_references_tests.mjs
          node tests/browser/run_drawio_p5_saved_replay_tests.mjs
          node tests/browser/run_drawio_p6_position_navigation_tests.mjs
          node tests/browser/run_nessus_p3_reviewed_references_tests.mjs
          node tests/browser/run_nmap_xml_observation_ui_tests.mjs
          node tests/browser/run_odt_p6_report_replay_tests.mjs
          node tests/browser/run_docx_p6_report_replay_tests.mjs
      - name: Build compiled YadiLab and verify browser distribution identity
        run: |
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Actual Chromium DRAWIO P2-P6 and Nmap live DOM regressions
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18991 --bind 127.0.0.1 --directory ui/dist >/tmp/drawio-p6-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:18991/browser-build-manifest.json >/dev/null 2>&1; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:18991/browser-build-manifest.json >/dev/null
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_drawio_p2_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/p2
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_drawio_p3_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/p3
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_drawio_p4_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/p4
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_drawio_p5_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/p5
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_drawio_p6_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/p6
          /tmp/drawio-p6-venv/bin/python tests/acceptance/run_nmap_xml_p2_real_browser.py --url http://127.0.0.1:18991/ --evidence-dir /tmp/drawio-p6-evidence/nmap
      - name: Preserve real Chromium acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawio-p6-position-navigation-chromium
          path: /tmp/drawio-p6-evidence/
          if-no-files-found: ignore
